name: CGL CPU checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements-cgl-test.txt
      - run: pip install -r requirements-cgl-test.txt --extra-index-url https://download.pytorch.org/whl/cpu
      - run: python -m compileall -q verl
      - run: bash -n scripts/train_cgl.sh
      - run: pytest -q tests/cgl
      - run: ruff check verl/trainer/ppo/cgl.py verl/utils/reward_score/android_control.py tests/cgl
